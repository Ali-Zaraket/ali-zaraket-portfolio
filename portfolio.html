<title>Playground Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio of Ali Zaraket, a mobile, web and Web3 engineer in Beirut, Lebanon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed toy stage (four switchable scenes) above a quiet two-column portfolio sheet. */
:root{
  --bg:#0b0c0f; --surface:#14161b; --raised:#1c1f26; --fg:#ecebe6; --muted:#8d9099; --line:#262931;
  --accent:#ffc35c; --sun:#ffc35c; --accent-ink:#1d1504; --ok:#4cd68a;
  --scrim:rgba(11,12,15,.74); --shadow:rgba(0,0,0,.55); --tile:#ecebe6; --tile-ink:#121317;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f2f4; --surface:#ffffff; --raised:#e6e8ec; --fg:#14151a; --muted:#5a5e68; --line:#d8dbe1;
    --accent:#9a5c00; --sun:#f0a020; --accent-ink:#ffffff; --ok:#13854a;
    --scrim:rgba(241,242,244,.8); --shadow:rgba(20,22,30,.22); --tile:#ffffff; --tile-ink:#14151a;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f1f2f4; --surface:#ffffff; --raised:#e6e8ec; --fg:#14151a; --muted:#5a5e68; --line:#d8dbe1;
  --accent:#9a5c00; --sun:#f0a020; --accent-ink:#ffffff; --ok:#13854a;
  --scrim:rgba(241,242,244,.8); --shadow:rgba(20,22,30,.22); --tile:#ffffff; --tile-ink:#14151a;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.band{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1200px;margin-inline:auto}

.skip{position:absolute;left:12px;top:-60px;z-index:30;padding:8px 12px;border-radius:8px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:500}
.skip:focus{top:12px}

/* ---------- header ---------- */
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-block:14px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-width:0}
.brand h1{margin:0;font:700 19px/1.2 var(--display);letter-spacing:-.01em}
.brand-role{font:12px/1.3 var(--mono);color:var(--muted)}

/* ---------- stage ---------- */
.stage{position:relative;height:clamp(460px,74vh,780px);height:clamp(460px,74svh,780px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border-block:1px solid var(--line);background:var(--bg)}
/* each toy is its own stacking layer, so dragged cards can never rise above the HUD, popover or results card */
.scene{position:absolute;inset:0;z-index:0;isolation:isolate}
.scene > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:var(--muted)}

.stage-bar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));pointer-events:none}
.hint{flex:1 1 200px;min-width:0;margin:0;font:12px/1.45 var(--mono);color:var(--muted)}
.stage-actions{display:flex;gap:8px;pointer-events:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:500 13px/1 var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn .ic{width:15px;height:15px}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{border-color:var(--fg)}
.btn .best{font:11px/1 var(--mono);opacity:.75}
.icon-btn{display:grid;place-items:center;width:30px;height:30px;flex:none;padding:0;border:0;border-radius:50%;background:var(--raised);color:var(--fg);cursor:pointer}
.icon-btn:hover{background:var(--line)}
.icon-btn .ic{width:15px;height:15px}

.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:18px;align-items:baseline;padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
#hud-left{color:var(--muted)}
#hud-right{display:inline-block;color:var(--accent)}
.hud.bump #hud-right{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}

.pop{position:absolute;z-index:9;width:min(280px, calc(100% - 24px));padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 22px 44px -18px var(--shadow)}
.pop-label{margin:0 0 4px;font:11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pop-value{margin:0 32px 14px 0;font:600 18px/1.3 var(--body);overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.pop-actions{display:flex;flex-wrap:wrap;gap:8px}
.pop-x{position:absolute;top:10px;right:10px}

.endcard{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.endcard-panel{width:min(320px,100%);padding:26px 24px 22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:center;box-shadow:0 30px 60px -24px var(--shadow)}
.end-kicker{margin:0;font:11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.end-num{margin:10px 0 2px;font:800 64px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.end-unit{margin:0;color:var(--muted)}
.end-best{margin:14px 0 18px;font:500 13px/1.3 var(--mono);color:var(--accent)}
.end-actions{display:flex;gap:8px;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:40;max-width:calc(100% - 32px);transform:translate(-50%,16px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font:500 13px/1.4 var(--body);text-align:center;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- orbit ---------- */
.sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(80%,760px);text-align:center;pointer-events:none}
.sun-name{display:block;font:760 clamp(36px,6.6vw,88px)/.95 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.035em;text-wrap:balance}
.sun-role{display:block;margin-top:12px;font:13px/1.3 var(--mono);color:var(--muted)}
.planet{position:absolute;left:0;top:0;width:var(--d,60px);height:var(--d,60px);padding:0;border:0;background:none;cursor:grab;touch-action:none;will-change:transform;-webkit-tap-highlight-color:transparent}
.planet-body{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:1px solid var(--line);background:var(--surface);transition:border-color .2s}
.planet .ic{width:22px;height:22px}
.planet:hover .planet-body,.planet.held .planet-body{border-color:var(--sun)}
.planet.held{cursor:grabbing}
.planet-label{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font:11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.planet.hit .planet-body{animation:hit .5s ease-out}
@keyframes hit{0%{scale:1.4;background:var(--sun);color:var(--accent-ink);border-color:var(--sun)}100%{scale:1}}
.planet:focus-visible{outline:none}
.planet:focus-visible .planet-body{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- magnets ---------- */
.fridge{position:absolute;inset:0;background:linear-gradient(100deg,var(--bg) 0%,var(--surface) 48%,var(--bg) 100%)}
.handle{position:absolute;left:14px;top:16%;height:46%;width:7px;border-radius:7px;background:var(--raised);border:1px solid var(--line)}
.mag{position:absolute;left:0;top:0;padding:6px 10px 7px;border:0;border-radius:2px;background:var(--tile);color:var(--tile-ink);font:500 15px/1.15 var(--body);white-space:nowrap;cursor:grab;touch-action:none;will-change:transform;box-shadow:0 1px 0 var(--shadow),0 5px 12px -6px var(--shadow);transition:scale .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
.mag.name{padding:8px 12px 9px;font:780 24px/1 var(--display);letter-spacing:-.02em}
.mag.contact{display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--fg);font:500 13px/1 var(--body)}
.mag.contact .ic{width:15px;height:15px;color:var(--sun)}
.mag.lift{scale:1.07;cursor:grabbing;box-shadow:0 16px 30px -12px var(--shadow)}
.mag.locked{cursor:default;box-shadow:0 0 0 2px var(--sun)}
.scene.scrambling .mag{transition:transform .7s cubic-bezier(.2,.8,.2,1),scale .12s}
.scene.shaking .fridge{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.note{position:absolute;padding:24px 16px 16px;border-radius:3px;background:var(--accent);color:var(--accent-ink);transform:rotate(-2deg);box-shadow:0 18px 30px -16px var(--shadow);transition:transform .15s;z-index:1;user-select:text;-webkit-user-select:text}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--fg);box-shadow:0 3px 6px var(--shadow)}
.note.over{transform:rotate(0deg) scale(1.05)}
.note.flash{animation:noteflash .4s ease-out}
@keyframes noteflash{0%{transform:rotate(1deg) scale(1.08)}100%{transform:rotate(-2deg)}}
.note-label{margin:0 0 6px;font:11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;opacity:.8}
.note-value{margin:0 0 12px;font:650 17px/1.25 var(--body);overflow-wrap:anywhere}
.note-hint{margin:0;font:500 14px/1.35 var(--body)}
.note-actions{display:flex;flex-wrap:wrap;gap:6px}
.btn-note{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent);padding:7px 11px;font-size:12px}
.slot{position:absolute;border:1.5px dashed var(--muted);border-radius:3px;pointer-events:none}
.slot.filled{border-color:transparent}
.spell-prompt{position:absolute;margin:0;font:12px/1.3 var(--mono);color:var(--muted);pointer-events:none;white-space:nowrap}
.spell-prompt b{color:var(--fg);font-weight:500}

/* ---------- falling ---------- */
.fall-layer{position:absolute;inset:0;cursor:grab;touch-action:none}
.fall-layer.grabbing{cursor:grabbing}
.floor-line{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.tower-line{position:absolute;left:0;right:0;border-top:1px dashed var(--sun);pointer-events:none;z-index:2}
.tower-line span{position:absolute;right:16px;bottom:6px;font:500 12px/1 var(--mono);color:var(--accent)}
.chip{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--fg);font:500 15px/1 var(--body);white-space:nowrap;pointer-events:none;will-change:transform}
.chip-name{padding:12px 20px;border-color:var(--fg);background:var(--fg);color:var(--bg);font:780 clamp(22px,4.2vw,32px)/1 var(--display);letter-spacing:-.02em}
.chip-skill{background:transparent;color:var(--muted)}
.chip-contact{border-color:var(--sun);background:var(--surface)}
.chip-contact .ic{width:16px;height:16px;color:var(--sun)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- plane ---------- */
.plane-hero{position:absolute;z-index:1;top:clamp(20px,6vh,60px);left:max(24px, env(safe-area-inset-left, 0px));max-width:min(62%,760px);pointer-events:none}
.ph-name{margin:0;font:800 clamp(44px,9vw,124px)/.9 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.045em;text-wrap:balance}
.ph-role{margin:16px 0 4px;font:13px/1.4 var(--mono);color:var(--muted)}
.ph-tag{margin:0;font:500 clamp(17px,2vw,22px)/1.35 var(--display);max-width:30ch}
.bullseye{position:absolute;z-index:1;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,transparent 0 31px,var(--line) 31px 32px);-webkit-mask:radial-gradient(circle,#000 40%,transparent 70%);mask:radial-gradient(circle,#000 40%,transparent 70%)}
.target{position:absolute;z-index:2;right:max(24px, env(safe-area-inset-right, 0px));bottom:78px;width:270px;padding:14px 14px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .2s,box-shadow .2s;user-select:text;-webkit-user-select:text}
.target.landed{border-color:var(--sun);box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 25%,transparent)}
.target-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.target-head i{font-style:normal;color:var(--accent)}
.t-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.t-row .ic{width:15px;height:15px;color:var(--muted)}
.t-v{flex:1;min-width:0;font:500 13px/1.3 var(--body);overflow-wrap:anywhere}
.t-links{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.t-links a{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;color:var(--fg)}
.t-links a:hover{border-color:var(--sun)}
.t-links .ic{width:15px;height:15px}
#scene-plane > canvas{z-index:3;pointer-events:none}
.callout{position:absolute;z-index:4;padding:6px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font:500 12px/1.2 var(--mono);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .2s}
.callout.show{opacity:1}

/* ---------- contact strip ---------- */
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 10px;padding-block:16px}
.cs-item{display:inline-flex;align-items:center;gap:9px;max-width:100%;padding:5px 5px 5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-width:0}
.cs-item .ic{color:var(--muted)}
.cs-value{font:500 14px/1.2 var(--body);min-width:0;overflow-wrap:anywhere;user-select:text}
.cs-link{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font:500 14px/1.2 var(--body);transition:border-color .15s}
.cs-link:hover{border-color:var(--muted)}
.cs-link .ic{color:var(--muted)}

/* ---------- portfolio sheet ---------- */
.info .wrap{display:grid;gap:72px;padding-block:56px 64px}
.sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.sec > h2{margin:4px 0 0;font:500 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.bio{margin:0 0 32px;max-width:34ch;font:500 clamp(22px,2.6vw,32px)/1.3 var(--display);letter-spacing:-.015em;text-wrap:pretty}
.highs{list-style:none;margin:0 0 32px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px 28px}
.highs li{display:grid;gap:6px;align-content:start;padding-top:14px;border-top:1px solid var(--line);min-width:0}
.highs b{font:780 clamp(40px,5vw,58px)/1 var(--display);letter-spacing:-.035em;color:var(--accent);font-variant-numeric:tabular-nums}
.highs span{font:12px/1.4 var(--mono);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 28px;margin:0}
.facts div{min-width:0}
.facts dt{font:12px/1.3 var(--mono);color:var(--muted)}
.facts dd{margin:5px 0 0;font-weight:500;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent);vertical-align:1px}
.list{list-style:none;margin:0;padding:0}
.work li{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:6px 18px;align-items:baseline;padding:20px 0;border-top:1px solid var(--line)}
.work li:last-child,.exp li:last-child{border-bottom:1px solid var(--line)}
.yr{font:13px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.w-title{margin:0;font:650 20px/1.25 var(--display);letter-spacing:-.01em}
.w-title a{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.w-title a:hover{text-decoration:underline;text-underline-offset:3px}
.w-title .ic{width:16px;height:16px;color:var(--muted)}
.w-text{margin:4px 0 0;max-width:62ch;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tag{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font:12px/1.2 var(--mono);color:var(--muted);white-space:nowrap}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.skills h3{margin:0 0 10px;font:500 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.skill{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--surface)}
.exp li{display:grid;grid-template-columns:172px minmax(0,1fr);gap:4px 18px;padding:18px 0;border-top:1px solid var(--line)}
.exp h3{margin:0;font:600 17px/1.3 var(--body)}
.exp h3 span{color:var(--muted);font-weight:400}
.exp p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.faq .qa{padding:18px 0;border-top:1px solid var(--line)}
.faq .qa:last-child{border-bottom:1px solid var(--line)}
.qa h3{margin:0;font:600 17px/1.35 var(--body);text-wrap:balance}
.qa p{margin:6px 0 0;max-width:68ch;color:var(--muted)}
.hello{font-style:normal}
.hello-kicker{margin:0 0 10px;color:var(--muted)}
.hello-mail{display:block;margin:0 0 18px;font:760 clamp(30px,5.6vw,68px)/1.02 var(--display);letter-spacing:-.035em;text-decoration:none;overflow-wrap:anywhere}
.hello-mail:hover{color:var(--accent)}
.hello-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.hello-phone{font:500 18px/1.2 var(--mono);margin-right:6px;user-select:text}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:22px 40px;border-top:1px solid var(--line);font:12px/1.4 var(--mono);color:var(--muted)}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--fg)}

@media (max-width:720px){
  .sec{grid-template-columns:1fr;gap:16px}
  .info .wrap{gap:56px;padding-block:40px 48px}
}
@media (max-width:600px){
  .stage{height:clamp(440px,66vh,640px);height:clamp(440px,66svh,640px)}
  .work li{grid-template-columns:minmax(0,1fr)}
  .tags{justify-content:flex-start}
  .exp li{grid-template-columns:1fr}
  .target{width:212px;bottom:84px}
  .t-links a{width:28px;height:28px}
  .plane-hero{max-width:calc(100% - 48px)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<a class="skip" href="#about">Skip to the portfolio</a>

<header class="top band" id="top">
  <div class="wrap">
    <div class="brand"><h1 id="brand-name"></h1><span class="brand-role" id="brand-role"></span></div>
    <a class="btn btn-accent hello-link" id="hello-link" href="#contact">Say hello</a>

const Magnets = (() => {

  const TAG = CONFIG.tagline.trim().split(/\s+/);

      let x = L + Math.max(0, (Rr - L - r.rw) / 2); const y = zoneTop + ri * (rowH + 12);
      r.row.forEach(t => {
        const s = { word: t.text, x, y, w: t.w + 6, h: rowH, filled: false, el: document.createElement('div') };
        s.el.className = 'slot'; Object.assign(s.el.style, { left: x + 'px', top: y + 'px', width: s.w + 'px', height: s.h + 'px' });

    prompt.style.left = L + Math.max(0, (Rr - L - (rows[0] ? rows[0].rw : 0)) / 2) + 'px'; prompt.style.top = (zoneTop - 26) + 'px';

})();

/* =====================================================================
   3. FALLING: words with real physics, tower as the game
   ===================================================================== */
const Falling = (() => {
  const el = $('#scene-falling'), layer = $('.fall-layer', el), floorEl = $('.floor-line', el), tower = $('.tower-line', el), towerLabel = $('span', tower);
  let inited = false, pending = false, running = false, raf = 0, last = 0, acc = 0;
  let M = null, engine = null, walls = [], items = [], drag = null, w = 0, h = 0, floorY = 0;
  const local = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  function words() {
    const list = [{ text: CONFIG.name, kind: 'name' }];
    CONFIG.role.split(/\s+/).map(x => x.replace(/[,·]/g, '')).filter(Boolean).forEach(x => list.push({ text: x, kind: 'word' }));
    list.push({ text: 'from', kind: 'word' }, { text: CONFIG.city, kind: 'word' });
    Object.values(CONFIG.skills).flat().slice(0, w < 640 ? 5 : 10).forEach(s => list.push({ text: s, kind: 'skill' }));
    CONFIG.contacts.forEach(c => list.push({ text: c.label, kind: 'contact', id: c.id, icon: c.icon, value: c.value }));
    return list.sort(() => Math.random() - 0.5);
  }
  function buildWalls() {
    if (walls.length) M.Composite.remove(engine.world, walls);
    const T = 300; floorY = h - 56;
    walls = [
      M.Bodies.rectangle(w / 2, floorY + T / 2, w + T * 2, T, { isStatic: true, friction: 0.8 }),
      M.Bodies.rectangle(-T / 2, floorY - h * 2, T, h * 4 + T, { isStatic: true }),
      M.Bodies.rectangle(w + T / 2, floorY - h * 2, T, h * 4 + T, { isStatic: true }),

  }
  function init() {

    w = el.clientWidth; h = el.clientHeight;
    engine = M.Engine.create(); engine.gravity.y = 1;
    buildWalls();
    let x = 24, y = 20, rowH = 0;
    words().forEach(d => {
      const isBtn = d.kind === 'contact';
      const e = document.createElement(isBtn ? 'button' : 'div');
      e.className = 'chip chip-' + d.kind;
      if (isBtn) { e.type = 'button'; e.innerHTML = ic(d.icon) + esc(d.text); e.setAttribute('aria-label', `${d.text}: ${d.value}`); }
      else { e.textContent = d.text; e.setAttribute('aria-hidden', 'true'); }
      layer.appendChild(e);
      const bw = e.offsetWidth, bh = e.offsetHeight;
      if (x + bw > w - 24) { x = 24; y += rowH + 16; rowH = 0; }
      const body = M.Bodies.rectangle(x + bw / 2, y + bh / 2, bw, bh, {
        chamfer: { radius: Math.max(2, Math.min(bh / 2 - 1, 18)) }, restitution: 0.25, friction: 0.5, frictionAir: 0.012, density: 0.0015
      });
      M.Body.setAngle(body, rand(-0.25, 0.25));
      const it = { ...d, el: e, body, w: bw, h: bh };
      items.push(it);
      if (isBtn) e.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openPop(it.id, body.position.x, body.position.y); } });
      x += bw + rand(14, 34); rowH = Math.max(rowH, bh);
    });

    layer.addEventListener('pointermove', onMove);
    layer.addEventListener('pointerup', onUp);
    layer.addEventListener('pointercancel', onUp);

  }
  function onDown(e) {

    layer.classList.add('grabbing');
  }
  function onMove(e) {

    drag.moved = Math.max(drag.moved, Math.hypot(pt.x - drag.x0, pt.y - drag.y0));
  }
  function release() { if (!drag) return; M.Composite.remove(engine.world, drag.c); drag = null; layer.classList.remove('grabbing'); }
  function onUp() {
    if (!drag) return;
    const d = drag; release();
    if (d.moved < 6 && performance.now() - d.t0 < 450 && d.it.kind === 'contact') openPop(d.it.id, d.it.body.position.x, d.it.body.position.y);
  }
  function towerHeight() {
    let top = floorY;
    for (const it of items) { if (drag && drag.it === it) continue; if (it.body.speed > 0.6) continue; top = Math.min(top, it.body.bounds.min.y); }
    return Math.max(0, floorY - top);
  }
  function showTower() { const hp = towerHeight(); tower.style.top = (floorY - hp) + 'px'; const cm = Math.round(hp / 10); towerLabel.textContent = `${cm} cm`; return cm; }
  function sync() { for (const it of items) { const p = it.body.position; it.el.style.transform = `translate(${p.x - it.w / 2}px,${p.y - it.h / 2}px) rotate(${it.body.angle}rad)`; } }

    let n = 0; while (acc >= 1000 / 60 && n < 4) { M.Engine.update(engine, 1000 / 60); acc -= 1000 / 60; n++; }
    if (n === 4) acc = 0;
    sync();
    if (Game.isActive('falling') && !Game.locked) Game.set(showTower());
    raf = requestAnimationFrame(loop);
  }
  function run() {
    if (!engine) return;
    running = true; last = performance.now(); acc = 0;

  }
  function resize() {
    if (!engine) return;
    w = el.clientWidth; h = el.clientHeight; buildWalls();
    items.forEach(it => { const p = it.body.position; const nx = clamp(p.x, it.w / 2, w - it.w / 2), ny = Math.min(p.y, floorY - it.h / 2); if (nx !== p.x || ny !== p.y) M.Body.setPosition(it.body, { x: nx, y: ny }); });
  }
  return {
    start() {
      if (inited) { resize(); run(); return; }
      if (pending) return; pending = true;
      fontsReady.then(() => { pending = false; if (currentMode !== 'falling' || inited) return; init(); run(); });
    },
    stop() { running = false; cancelAnimationFrame(raf); if (engine) release(); },
    resize,
    shake() { if (!engine) return; items.forEach(i => { M.Body.setVelocity(i.body, { x: rand(-9, 9), y: rand(-17, -8) }); M.Body.setAngularVelocity(i.body, rand(-0.25, 0.25)); }); },
    shakeLabel: 'Shake',
    hint: 'Grab a word and throw it · tap a contact to open it',
    game: {
      name: 'Tower', unit: 'tallest tower in 20 seconds', better: 'higher', duration: 20,
      intro: 'Tower: stack the words as high as you can in 20 seconds. It counts once it stands still.',
      format: n => `${n} cm`,
      hud: (e, s) => [`${Math.max(0, Math.ceil(20 - e))}s`, `${s} cm`],
      start() { tower.hidden = !engine; },
      onTimeUp() { if (engine) release(); setTimeout(() => { if (Game.isActive('falling')) Game.finish(engine ? showTower() : 0); }, 1300); },
      stop() { tower.hidden = true; }
    }
  };
})();

/* =====================================================================
   4. PLANE: throw a paper plane at the contact card
   ===================================================================== */
const Plane = (() => {
  const el = $('#scene-plane'), cv = $('canvas', el), ctx = cv.getContext('2d');

  let inited = false, running = false, raf = 0, last = 0, t = 0;
  let w = 0, h = 0, dpr = 1, floorY = 0, pad = { x: 0, y: 0 }, tr = { x: 0, y: 0, w: 0, h: 0, cx: 0, cy: 0 };
  const P = { x: 0, y: 0, vx: 0, vy: 0, a: -0.35, mode: 'ready' };
  let trail = [], conf = [], aim = null, resetAt = 0, throws = 0, calloutT = 0, labelFont = '11px monospace';
  const local = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  function init() {
    $('.ph-name', el).textContent = CONFIG.name;
    $('.ph-role', el).textContent = `${CONFIG.role} · ${CONFIG.city}`;
    $('.ph-tag', el).textContent = CONFIG.headline || (CONFIG.tagline.charAt(0).toUpperCase() + CONFIG.tagline.slice(1) + '.');
    const row = id => { const c = contactById(id); return c ? `<div class="t-row" data-value-scope>${ic(c.icon)}<span class="t-v copy-src">${esc(c.value)}</span><button type="button" class="icon-btn" data-copy="${c.id}" aria-label="Copy ${esc(c.label.toLowerCase())}">${ic('copy')}</button></div>` : ''; };
    const links = CONFIG.contacts.filter(c => !c.copy && c.href).map(c => `<a href="${esc(c.href)}"${isExternal(c.href) ? ' target="_blank" rel="noopener"' : ''} aria-label="${esc(c.label)}" title="${esc(c.label)}">${ic(c.icon)}</a>`).join('');
    target.innerHTML = `<div class="target-head"><span>Land here</span><i>100 pts centre</i></div>${row('email')}${row('phone')}<div class="t-links">${links}</div>`;
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', () => { if (aim) { aim = null; resetPlane(); } });
    labelFont = '11px ' + getComputedStyle(document.documentElement).getPropertyValue('--mono');
    fontsReady.then(() => { if (currentMode === 'plane') resize(); });
    inited = true;
  }
  function resetPlane() { P.mode = 'ready'; P.x = pad.x; P.y = pad.y; P.vx = P.vy = 0; P.a = -0.35; trail = []; target.classList.remove('landed'); }
  function onDown(e) {
    if (e.button > 0 || e.target.closest('.target') || P.mode !== 'ready' || Game.locked) return;
    el.setPointerCapture(e.pointerId);
    const pt = local(e); aim = { x0: pt.x, y0: pt.y, dx: 0, dy: 0 }; P.mode = 'aim';

  function onMove(e) {
    if (!aim) return;
    const pt = local(e); let dx = pt.x - aim.x0, dy = pt.y - aim.y0; const d = Math.hypot(dx, dy), max = 130;
    if (d > max) { dx *= max / d; dy *= max / d; }
    aim.dx = dx; aim.dy = dy;

    P.x = clamp(pad.x + dx * 0.45, 16, w - 16); P.y = clamp(pad.y + dy * 0.45, 16, floorY - 18);

  }
  function launchVel(dx, dy) { const k = Math.sqrt(w * h) * 1.2 / 130; return { vx: -dx * k, vy: -dy * k }; }
  function onUp() {
    if (!aim) return;
    const { dx, dy } = aim; aim = null;
    if (Math.hypot(dx, dy) < 14) { resetPlane(); say('Pull back further, then let go', pad.x + 40, pad.y - 30); return; }
    const v = launchVel(dx, dy); P.vx = v.vx; P.vy = v.vy; P.mode = 'fly'; trail = [];
  }
  function physics(o, dt) {
    const g = 980 * (h / 700);

    const lift = 0.55 * g * Math.cos(ang) ** 2 * Math.min(1, sp / 500);

  function say(text, x, y) {

      trail.push(P.x, P.y); if (trail.length > 120) trail.splice(0, 2);

    if (trail.length > 2) {

      for (let i = 2; i < trail.length; i += 2) ctx.lineTo(trail[i], trail[i + 1]);

    }
    if (P.mode === 'aim' && aim && Math.hypot(aim.dx, aim.dy) > 4) {

/* =====================================================================

   ===================================================================== */

  sceneOf(name).hidden = false;
  const m = MODES[name];
  hintEl.textContent = m.hint;
  shakeBtn.hidden = !m.shake; shakeBtn.textContent = m.shakeLabel || '';
  Game.label();
  m.start();
}
shakeBtn.addEventListener('click', () => { const m = MODES[currentMode]; if (m.shake) m.shake(); });
$('#to-top').addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); });

new ResizeObserver(() => {
  SW = stage.clientWidth; SH = stage.clientHeight;
  if (currentMode) MODES[currentMode].resize();
}).observe(stage);

/* =====================================================================
   PORTFOLIO SHEET
   ===================================================================== */
function renderSheet() {
  const P = sheetParts(CONFIG, { appNote: !IS_SITE });
  $('#brand-name').textContent = CONFIG.name;
  $('#brand-role').textContent = CONFIG.role;
  if (!IS_SITE) document.title = `${CONFIG.name} · Portfolio`;
  $('#strip').innerHTML = P.strip;
  $('#bio').textContent = CONFIG.bio;
  $('#facts').innerHTML = P.facts;
  $('#highlights').hidden = !P.highlights; $('#highlights').innerHTML = P.highlights;
  $('#work-list').innerHTML = P.work;
  $('#skills-list').innerHTML = P.skills;
  $('#exp-list').innerHTML = P.exp;
  $('#education').hidden = !P.edu; $('#edu-list').innerHTML = P.edu;
  $('#faq').hidden = !P.faq; $('#faq-list').innerHTML = P.faq;
  $('#hello').innerHTML = P.hello;
  $('#foot-left').innerHTML = P.foot;
  const tick = () => {
    let s = '';
    try { s = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: CONFIG.timezone }).format(new Date()); } catch (e) { s = '–'; }
    $('#local-time').textContent = `${s} (${CONFIG.timezone})`;
  };
  tick(); setInterval(tick, 20000);
}

renderSheet();
setMode(ACTIVE_TOY);
})();
</script>
